<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registrasi - TOKO DONYGK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-weight: 700; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; font-size: 14px; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #3498db; }
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #27ae60; }
        .switch { text-align: center; margin-top: 20px; font-size: 14px; color: #7f8c8d; }
        .switch a { color: #3498db; text-decoration: none; font-weight: 600; cursor: pointer; }
        .hidden { display: none; }
        .msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 600; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM TERPADU UNTUK DIKIRIM KE GOOGLE APPS SCRIPT -->
    <form id="authForm" method="POST" target="hidden_iframe" action="MASUKKAN_URL_WEB_APP_ANDA_DISINI">
        
        <!-- FORM LOGIN -->
        <div id="loginForm">
            <h2>Login TOKO DONYGK</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" id="loginUsername" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="loginPassword" placeholder="Masukkan password">
            </div>
            <input type="hidden" name="action" id="loginAction" value="login">
            <button type="button" onclick="kirimData('login')">Masuk</button>
            <div class="switch">Belum punya akun? <a onclick="toggleForm('register')">Daftar di sini</a></div>
        </div>

        <!-- FORM REGISTER -->
        <div id="registerForm" class="hidden">
            <h2>Daftar Akun Baru</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" id="regUsername" placeholder="Buat username unik">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" id="regEmail" placeholder="email@domain.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="regPassword" placeholder="Buat password aman">
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" name="keterangan" id="regKeterangan" value="Member Aktif">
            </div>
            <input type="hidden" name="action" id="regAction" value="register">
            <button type="button" onclick="kirimData('register')">Daftar Sekarang</button>
            <div class="switch">Sudah punya akun? <a onclick="toggleForm('login')">Login di sini</a></div>
        </div>
    </form>

    <div id="message" class="msg"></div>
</div>

<!-- IFRAME TERSEMBUNYI AGAR TIDAK ADA RELOAD HALAMAN & BEBAS CORS -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="handleResponse()"></iframe>

<script>
    // URL Web App Anda
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx8AH4OkKoopyWyBTUVrMzxj8JHyCeEJWxVtdr1qAfcxHUfINmNR4_WmiwSW3bQVMVn/exec";
    document.getElementById('authForm').action = WEB_APP_URL;

    let currentAction = "";

    function toggleForm(type) {
        document.getElementById('message').innerText = "";
        if(type === 'register') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        } else {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
    }

    function kirimData(type) {
        currentAction = type;
        let msg = document.getElementById('message');
        
        if (type === 'register') {
            let u = document.getElementById('regUsername').value;
            let e = document.getElementById('regEmail').value;
            let p = document.getElementById('regPassword').value;
            if(!u || !e || !p) {
                msg.className = "msg error";
                msg.innerText = "Semua kolom wajib diisi!";
                return;
            }
            msg.className = "msg";
            msg.innerText = "Memproses pendaftaran...";
        } else {
            let u = document.getElementById('loginUsername').value;
            let p = document.getElementById('loginPassword').value;
            if(!u || !p) {
                msg.className = "msg error";
                msg.innerText = "Username dan password harus diisi!";
                return;
            }
            msg.className = "msg";
            msg.innerText = "Memeriksa data...";
        }

        // Kirim form secara langsung ke iframe
        document.getElementById('authForm').submit();

        // Berikan feedback sukses sementara setelah tombol ditekan
        setTimeout(() => {
            msg.className = "msg success";
            msg.innerText = type === 'register' ? "Data berhasil dikirim! Cek Spreadsheet Anda." : "Permintaan login dikirim!";
        }, 1500);
    }

    function handleResponse() {
        // Fungsi pemicu saat iframe selesai menerima respons dari backend
        let msg = document.getElementById('message');
        if (currentAction === 'register' && msg.innerText.includes("Memproses")) {
            msg.className = "msg success";
            msg.innerText = "Registrasi berhasil dicatat!";
            setTimeout(() => toggleForm('login'), 2000);
        }
    }
</script>

</body>
</html>
