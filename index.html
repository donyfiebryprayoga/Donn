<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Login - TOKO DONYGK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-weight: 700; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; font-size: 14px; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s, transform 0.1s; }
        button:hover { background-color: #27ae60; }
        button:active { transform: scale(0.98); }
        .switch { text-align: center; margin-top: 20px; font-size: 14px; color: #7f8c8d; }
        .switch a { color: #3498db; text-decoration: none; font-weight: 600; cursor: pointer; }
        .switch a:hover { text-decoration: underline; }
        .hidden { display: none; }
        .msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 600; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM LOGIN -->
    <div id="loginForm">
        <h2>Login TOKO DONYGK</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Masukkan username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Masukkan password">
        </div>
        <button onclick="prosesLogin()">Masuk</button>
        <div class="switch">Belum punya akun? <a onclick="toggleForm('register')">Daftar di sini</a></div>
    </div>

    <!-- FORM REGISTER -->
    <div id="registerForm" class="hidden">
        <h2>Daftar Akun Baru</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUsername" placeholder="Buat username unik">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="email@domain.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Buat password aman">
        </div>
        <div class="form-group">
            <label>Keterangan</label>
            <input type="text" id="regKeterangan" value="Member Aktif">
        </div>
        <button onclick="prosesRegister()">Daftar Sekarang</button>
        <div class="switch">Sudah punya akun? <a onclick="toggleForm('login')">Login di sini</a></div>
    </div>

    <div id="message" class="msg"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxuwb_Gy5m1T08GPLQXOfziysKYG94hmj7lm4LReKCcAGAEdvlNi74Xz8slCYVlhfze/exec";

    function toggleForm(type) {
        document.getElementById('message').innerText = "";
        if(type === 'register') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        } else {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
    }

    async function prosesRegister() {
        let username = document.getElementById('regUsername').value;
        let email = document.getElementById('regEmail').value;
        let password = document.getElementById('regPassword').value;
        let keterangan = document.getElementById('regKeterangan').value;
        let msg = document.getElementById('message');

        if(!username || !email || !password) {
            msg.className = "msg error";
            msg.innerText = "Semua kolom wajib diisi!";
            return;
        }

        msg.className = "msg";
        msg.innerText = "Memproses pendaftaran...";

        try {
            let response = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "register", username, email, password, keterangan })
            });
            let result = await response.json();
            
            msg.className = "msg " + (result.status === "success" ? "success" : "error");
            msg.innerText = result.message;
            if(result.status === "success") {
                setTimeout(() => toggleForm('login'), 2000);
            }
        } catch (error) {
            msg.className = "msg error";
            msg.innerText = "Terjadi kesalahan koneksi!";
        }
    }

    async function prosesLogin() {
        let username = document.getElementById('loginUsername').value;
        let password = document.getElementById('loginPassword').value;
        let msg = document.getElementById('message');

        @if(!username || !password) { ... }
        if(!username || !password) {
            msg.className = "msg error";
            msg.innerText = "Username dan password harus diisi!";
            return;
        }

        msg.className = "msg";
        msg.innerText = "Memeriksa data...";

        try {
            let response = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", username, password })
            });
            let result = await response.json();
            
            msg.className = "msg " + (result.status === "success" ? "success" : "error");
            msg.innerText = result.message + (result.keterangan ? " (" + result.keterangan + ")" : "");
        } catch (error) {
            msg.className = "msg error";
            msg.innerText = "Terjadi kesalahan koneksi!";
        }
    }
</script>

</body>
</html>
